<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DS Smoke & Vapor | Premium Smoke Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #050505;
        color: #e0e0e0;
        overflow-x: hidden;
        /* cursor: none; Removed to restore default cursor */
      }
      h1, h2, h3, h4, .brand-font {
        font-family: 'Orbitron', sans-serif;
      }
      .neon-text {
        text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #bf00ff, 0 0 30px #bf00ff, 0 0 40px #bf00ff;
      }
      .neon-text-green {
        text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px #00ff00, 0 0 30px #00ff00;
      }
      
      /* Film Grain */
      .bg-noise {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 50;
        opacity: 0.04;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      /* Smoke Animation */
      .fog-container {
        position: absolute;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 0;
        top: 0;
        left: 0;
        pointer-events: none;
      }
      .fog-img {
        position: absolute;
        height: 100vh;
        width: 300vw;
        z-index: 1;
        opacity: 0.3;
        background: url('https://raw.githubusercontent.com/danielstuart14/CSS_FOG_ANIMATION/master/fog1.png') repeat-x;
        background-size: contain;
        animation: fog 60s linear infinite;
      }
      .fog-img-2 {
        background: url('https://raw.githubusercontent.com/danielstuart14/CSS_FOG_ANIMATION/master/fog2.png') repeat-x;
        background-size: contain;
        animation: fog 40s linear infinite;
        z-index: 2;
        top: 20%;
      }
      @keyframes fog {
        0% { transform: translate3d(0, 0, 0); }
        100% { transform: translate3d(-200vw, 0, 0); }
      }
      .glass-panel {
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      
      /* Ticker Animation */
      @keyframes scroll {
        0% { transform: translateX(0); }
        100% { transform: translateX(-50%); }
      }
      .animate-scroll {
        animation: scroll 20s linear infinite;
      }
      
      /* 3D Tilt Utilities */
      .preserve-3d {
        transform-style: preserve-3d;
      }
      .perspective-1000 {
        perspective: 1000px;
      }

      /* Glitch Effect */
      .glitch-wrapper {
        position: relative;
      }
      .glitch-text {
        position: relative;
      }
      .glitch-text::before,
      .glitch-text::after {
        content: attr(data-text);
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      .glitch-text::before {
        left: 2px;
        text-shadow: -1px 0 #ff00c1;
        clip: rect(44px, 450px, 56px, 0);
        animation: glitch-anim 5s infinite linear alternate-reverse;
      }
      .glitch-text::after {
        left: -2px;
        text-shadow: -1px 0 #00fff9;
        clip: rect(44px, 450px, 56px, 0);
        animation: glitch-anim2 5s infinite linear alternate-reverse;
      }
      .confetti-layer {
        position: absolute;
        inset: -10%;
        background-image:
          radial-gradient(circle at 20% 20%, rgba(34, 197, 94, 0.9) 0 4px, transparent 5px),
          radial-gradient(circle at 80% 10%, rgba(168, 85, 247, 0.9) 0 4px, transparent 5px),
          radial-gradient(circle at 50% 40%, rgba(59, 130, 246, 0.9) 0 3px, transparent 4px),
          radial-gradient(circle at 15% 70%, rgba(251, 191, 36, 0.9) 0 3px, transparent 4px),
          radial-gradient(circle at 70% 80%, rgba(244, 114, 182, 0.9) 0 4px, transparent 5px);
        background-size: 20% 20%;
        opacity: 0.9;
        animation: confetti-fall 3.5s linear infinite;
      }
      .confetti-layer.confetti-delay {
        animation-delay: 1.2s;
        opacity: 0.6;
      }
      @keyframes confetti-fall {
        0% {
          transform: translateY(-10%) rotate(0deg);
        }
        100% {
          transform: translateY(15%) rotate(15deg);
        }
      }
      @keyframes glitch-anim {
        0% { clip: rect(32px, 9999px, 11px, 0); }
        20% { clip: rect(68px, 9999px, 89px, 0); }
        40% { clip: rect(12px, 9999px, 56px, 0); }
        60% { clip: rect(45px, 9999px, 23px, 0); }
        80% { clip: rect(89px, 9999px, 3px, 0); }
        100% { clip: rect(56px, 9999px, 78px, 0); }
      }
      @keyframes glitch-anim2 {
        0% { clip: rect(65px, 9999px, 99px, 0); }
        20% { clip: rect(3px, 9999px, 35px, 0); }
        40% { clip: rect(78px, 9999px, 56px, 0); }
        60% { clip: rect(12px, 9999px, 2px, 0); }
        80% { clip: rect(34px, 9999px, 89px, 0); }
        100% { clip: rect(9px, 9999px, 45px, 0); }
      }

      /* Holographic Sheen */
      .holographic-sheen {
        background: linear-gradient(
          115deg,
          transparent 0%,
          rgba(255, 255, 255, 0.05) 30%,
          rgba(255, 0, 255, 0.1) 40%,
          rgba(0, 255, 255, 0.1) 60%,
          rgba(255, 255, 255, 0.05) 70%,
          transparent 100%
        );
        background-size: 200% 200%;
        mix-blend-mode: color-dodge;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "lucide-react": "https://esm.sh/lucide-react@^0.563.0",

    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
